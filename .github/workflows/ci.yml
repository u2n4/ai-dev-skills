name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Validate JSON files (syntax)
        # `jq empty` reads + parses + discards. Exits non-zero on parse error.
        # Filename is passed as an argument — no shell interpolation into a
        # script, so filenames with shell metacharacters cannot inject code.
        run: |
          set -e
          while IFS= read -r -d '' f; do
            echo "validating $f"
            jq empty "$f"
          done < <(find . -name "*.json" -not -path "./node_modules/*" -print0)

      - name: Schema tests (manifests and SKILL.md frontmatter)
        run: uv run --with pyyaml==6.0.2 python -m unittest discover -s tests -v
